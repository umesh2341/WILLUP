<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Willup agentic workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0A0C0F"/>
      <stop offset="1" stop-color="#14181D"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#EDEEF0}
      .sub{font:400 17px Arial, sans-serif;fill:#8C949D}
      .nodeLabel{font:700 15px Arial, sans-serif;fill:#EDEEF0}
      .tag{font:700 22px Arial, sans-serif}
      .link{stroke:#363C44;stroke-width:4;fill:none;stroke-linecap:round}
      .pulse{stroke:#E68A3C;stroke-width:6;stroke-dasharray:10 26;animation:flow 2.4s linear infinite}
      .node{fill:#14181D;stroke-width:2}
      .g{stroke:#3FA66A}.b{stroke:#4F8FE0}.a{stroke:#E68A3C}
      .dot{fill:#E68A3C;animation:pulse 1.6s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-72}}
      @keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
    </style>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <g opacity=".22" stroke="#232A31" stroke-width="1">
    <path d="M0 70H1200M0 125H1200M0 180H1200M0 235H1200M0 290H1200M0 345H1200"/>
    <path d="M80 20V410M160 20V410M240 20V410M320 20V410M400 20V410M480 20V410M560 20V410M640 20V410M720 20V410M800 20V410M880 20V410M960 20V410M1040 20V410M1120 20V410"/>
  </g>

  <text x="55" y="52" class="title">WILLUP</text>
  <text x="55" y="81" class="sub">n8n-inspired agentic institutional workflow</text>

  <g>
    <path d="M150 225H245M335 225H430M535 225H630M740 225H820M925 225H1005" class="link"/>
    <path d="M150 225H245M335 225H430M535 225H630M740 225H820M925 225H1005" class="pulse"/>
  </g>

  <g class="node">
    <rect x="22" y="177" width="136" height="96" rx="18" class="node g"/>
    <circle cx="90" cy="225" r="24" fill="#1A1E24" class="g"/>
    <text x="90" y="288" text-anchor="middle" class="nodeLabel">STUDENT</text>
  </g>

  <g class="node">
    <rect x="207" y="177" width="136" height="96" rx="18" class="node b"/>
    <circle cx="275" cy="225" r="24" fill="#1A1E24" class="b"/>
    <text x="275" y="288" text-anchor="middle" class="nodeLabel">CHAT AI</text>
  </g>

  <g class="node">
    <rect x="392" y="177" width="136" height="96" rx="18" class="node b"/>
    <circle cx="460" cy="225" r="24" fill="#1A1E24" class="b"/>
    <text x="460" y="288" text-anchor="middle" class="nodeLabel">CATEGORY AI</text>
  </g>

  <g class="node">
    <rect x="592" y="177" width="136" height="96" rx="18" class="node a"/>
    <circle cx="660" cy="225" r="24" fill="#1A1E24" class="a"/>
    <text x="660" y="288" text-anchor="middle" class="nodeLabel">DOMAIN AI</text>
  </g>

  <g class="node">
    <rect x="782" y="177" width="136" height="96" rx="18" class="node a"/>
    <circle cx="850" cy="225" r="24" fill="#1A1E24" class="a"/>
    <text x="850" y="288" text-anchor="middle" class="nodeLabel">WORKFLOW</text>
  </g>

  <g class="node">
    <rect x="977" y="177" width="136" height="96" rx="18" class="node g"/>
    <circle cx="1045" cy="225" r="24" fill="#1A1E24" class="g"/>
    <text x="1045" y="288" text-anchor="middle" class="nodeLabel">HUMAN</text>
  </g>

  <circle cx="196" cy="225" r="6" class="dot" filter="url(#glow)"/>
  <circle cx="381" cy="225" r="6" class="dot" filter="url(#glow)" style="animation-delay:.25s"/>
  <circle cx="581" cy="225" r="6" class="dot" filter="url(#glow)" style="animation-delay:.5s"/>
  <circle cx="771" cy="225" r="6" class="dot" filter="url(#glow)" style="animation-delay:.75s"/>
  <circle cx="966" cy="225" r="6" class="dot" filter="url(#glow)" style="animation-delay:1s"/>

  <text x="55" y="386" class="tag" fill="#E68A3C">AI manages the flow.</text>
  <text x="365" y="386" class="tag" fill="#EDEEF0">Humans make the decisions.</text>
</svg>